[package]
name = "dad-local-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Delulu Core Team"]
description = "DAD local addon contract (M0): manifest types + validator, request/stream/meta/subtitle contracts + validators, 9-code error model, canonical signing payload. Pure serde — zero I/O, zero crypto."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
