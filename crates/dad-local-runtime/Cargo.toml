[package]
name = "dad-local-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Delulu Core Team"]
description = "The DAD local addon runtime: owns stdin/stdout, enforces the RPC envelope, runs handlers with panic containment, and validates every response before it leaves the process."

[dependencies]
dad-local-core = { path = "../dad-local-core" }
dad-local-macros = { path = "../dad-local-macros" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Feature-minimal tokio, per the portability policy: NO "process", NO "fs".
# The one-shot model needs only a current-thread executor for async handlers.
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "io-util"] }

# Reference addons — real binaries the spawn tests drive end-to-end
# (CARGO_BIN_EXE_* works for [[bin]] targets, not auto-discovered examples).
[[bin]]
name = "demo_open"
path = "reference/demo_open/main.rs"

[[bin]]
name = "demo_gated"
path = "reference/demo_gated/main.rs"
